<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16845b">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <title>Tableau de bord - ExCrypt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #fafafa; --card: #ffffff; --border: #eaecef;
            --text: #1e2329; --muted: #707a8a; --accent: #0b0e11;
            --green: #03a66d; --red: #cf304a; --input-bg: #fff;
            --amber: #d4a017;
        }

        [data-theme="dark"] {
            --bg: #12161c; --card: #1e2329; --border: #2b313a;
            --text: #eaecef; --muted: #848e9c; --accent: #fcd535;
            --green: #0ecb81; --red: #f6465d; --input-bg: #12161c;
            --amber: #f0b90b;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; transition: background 0.2s, color 0.2s; }
        svg { display: block; }
        .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .app { display: flex; min-height: 100vh; }

        .sidebar { width: 240px; background: var(--card); border-right: 1px solid var(--border); padding: 24px 16px; position: fixed; height: 100vh; left: 0; top: 0; display: flex; flex-direction: column; justify-content: space-between; z-index: 100; }
        .sidebar-top { display: flex; flex-direction: column; }
        .sidebar-logo { font-size: 19px; font-weight: 700; margin-bottom: 32px; padding: 0 12px; display: flex; align-items: center; gap: 8px; color: var(--text); }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { padding: 11px 12px; border-radius: 8px; margin-bottom: 2px; cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; font-weight: 500; }
        .sidebar-menu li:hover { background: var(--bg); color: var(--text); }
        .sidebar-menu li.active { background: var(--bg); color: var(--text); font-weight: 600; }
        .sidebar-menu li.logout { color: var(--red); margin-top: 10px; border-top: 1px solid var(--border); padding-top: 20px; }
        .sidebar-menu li.logout:hover { background: rgba(207, 48, 74, 0.1); }

        .main { margin-left: 240px; padding: 28px 32px 100px; flex: 1; max-width: 1200px; }

        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .topbar h1 { font-size: 22px; font-weight: 700; }
        .topbar-actions { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: var(--card); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); position: relative; }
        .icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 2px solid var(--card); }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 600; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .stat-header { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 500; }
        .stat-value { font-size: 22px; font-weight: 700; }
        .stat-sub { font-size: 12px; color: var(--green); font-weight: 600; }

        .actions-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 32px; }
        .action-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; transition: border-color 0.2s, transform 0.1s; }
        .action-card:hover { border-color: var(--text); transform: translateY(-2px); }
        .action-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text); }
        .action-card span { font-size: 13px; font-weight: 600; }

        .card-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .section-header-flex h3 { font-size: 16px; font-weight: 600; }
        .see-all { color: var(--muted); font-size: 13px; text-decoration: none; font-weight: 500; background: none; border: none; cursor: pointer; }
        .see-all:hover { color: var(--text); }

        .empty-transactions { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 0; gap: 12px; color: var(--muted); text-align: center; }
        .empty-transactions svg { width: 40px; height: 40px; opacity: 0.5; }
        .empty-transactions p { font-size: 14px; font-weight: 500; }
        .empty-transactions span { font-size: 12px; }

        .buy-container { display: flex; justify-content: center; width: 100%; }
        .buy-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; }
        .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-field label { font-size: 13px; font-weight: 500; color: var(--muted); }
        .input-group { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); overflow: hidden; }
        .input-group input, .input-group textarea { flex: 1; padding: 12px 14px; border: none; background: transparent; color: var(--text); font-size: 15px; outline: none; font-family: inherit; }
        .input-group select { padding: 12px 14px; border: none; background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; border-left: 1px solid var(--border); outline: none; cursor: pointer; }
        .rate-info { font-size: 12px; color: var(--muted); margin-bottom: 16px; display: flex; justify-content: space-between; background: var(--bg); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); }
        .rate-info span { font-weight: 600; color: var(--text); }
        .btn-submit { width: 100%; background: var(--accent); color: var(--bg); border: none; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { width: 100%; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-secondary:hover { border-color: var(--text); }

        .swap-btn { display: flex; justify-content: center; margin: -8px 0 16px; }
        .swap-btn button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .swap-btn button:hover { border-color: var(--text); }

        .address-box { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--border); border-radius: 8px; padding: 12px 14px; background: var(--bg); margin-bottom: 12px; }
        .address-box code { flex: 1; font-size: 12.5px; word-break: break-all; color: var(--text); }
        .copy-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 6px; padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .copy-btn:hover { border-color: var(--text); }

        .qr-placeholder { width: 140px; height: 140px; margin: 0 auto 16px; border: 1px solid var(--border); border-radius: 10px; background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 6px, var(--border) 6px, var(--border) 7px); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; text-align: center; padding: 8px; }

        .warning-box { font-size: 12px; color: var(--red); background: rgba(207, 48, 74, 0.08); border: 1px solid rgba(207, 48, 74, 0.25); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; line-height: 1.5; }
        .info-box { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; line-height: 1.5; }

        .wallet-total { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .wallet-total .label { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
        .wallet-total .value { font-size: 30px; font-weight: 700; }
        .wallet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .wallet-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
        .wallet-card-top { display: flex; align-items: center; justify-content: space-between; }
        .wallet-coin { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
        .coin-badge { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
        .wallet-amounts .amount { font-size: 17px; font-weight: 700; }
        .wallet-amounts .fcfa { font-size: 12px; color: var(--muted); }
        .wallet-card-actions { display: flex; gap: 8px; }
        .mini-btn { flex: 1; text-align: center; padding: 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; }
        .mini-btn:hover { border-color: var(--text); }

        .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 100px; font-size: 11px; font-weight: 700; }
        .badge-done { color: var(--green); background: rgba(3, 166, 109, 0.12); }
        .badge-pending { color: var(--amber); background: rgba(212, 160, 23, 0.14); }
        .badge-failed { color: var(--red); background: rgba(207, 48, 74, 0.12); }

        .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
        .chip { padding: 7px 14px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; }
        .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

        .tx-list { display: flex; flex-direction: column; gap: 10px; }
        .tx-item { display: flex; align-items: center; justify-content: space-between; padding: 14px; border: 1px solid var(--border); border-radius: 10px; gap: 12px; flex-wrap: wrap; }
        .tx-left { display: flex; align-items: center; gap: 12px; }
        .tx-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .tx-title { font-size: 14px; font-weight: 600; }
        .tx-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .tx-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .tx-amount { font-size: 14px; font-weight: 700; }
        .tx-actions { display: flex; gap: 6px; }
        .tx-actions button { font-size: 11px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-weight: 600; }
        .tx-actions button:hover { border-color: var(--text); }

        .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 22px; }
        .profile-name { font-size: 18px; font-weight: 700; }
        .profile-email { font-size: 13px; color: var(--muted); }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 560px) { .form-row-2 { grid-template-columns: 1fr; } }

        .settings-block { border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
        .settings-block h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .settings-block .desc { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--border); gap: 12px; }
        .settings-row:first-of-type { border-top: none; padding-top: 0; }
        .settings-row-label { font-size: 13.5px; font-weight: 600; }
        .settings-row-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; margin-top: 2px; }

        .toggle { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--border); border-radius: 24px; transition: .2s; }
        .toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: var(--card); border-radius: 50%; transition: .2s; }
        .toggle input:checked + .toggle-slider { background: var(--accent); }
        .toggle input:checked + .toggle-slider:before { transform: translateX(18px); }

        .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .segmented button { padding: 8px 16px; border: none; background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
        .segmented button.active { background: var(--accent); color: var(--bg); }

        .kyc-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 100px; font-size: 11.5px; font-weight: 700; margin-left: 8px; }

        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 8px 4px; z-index: 100; }
        .bottom-nav ul { list-style: none; display: flex; justify-content: space-around; }
        .bottom-nav li { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 11px; cursor: pointer; padding: 4px 8px; }
        .bottom-nav li.active { color: var(--text); font-weight: 600; }

        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 20px 16px 90px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .actions-grid { grid-template-columns: repeat(3, 1fr); }
            .wallet-grid { grid-template-columns: 1fr; }
            .bottom-nav { display: block; }
        }
    </style>

    <script src="../js/api.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>

    <script>
    /* =====================================================================
       Deux comptes distincts (FCFA et crypto). Taux d'achat et de vente
       différents (spread). Achat crédite le compte crypto au taux d'achat
       (à la confirmation), sans jamais toucher le FCFA. Vente débite le
       compte crypto immédiatement au taux de vente. Conversion débite/
       crédite les deux comptes concernés, avec le même principe de spread.
       ===================================================================== */

    const paymentNetworks = {

        if (newBuyRates) Object.keys(newBuyRates).forEach(c => { if (buyRates[c] !== undefined) buyRates[c] = newBuyRates[c]; });

    async function switchTab(tabName, presetCrypto) {
        document.querySelectorAll('.sidebar-menu li, .bottom-nav li').forEach(el => el.classList.remove('active'));
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `<div class="card-section" style="text-align:center; padding:60px 20px; color:var(--muted);">Chargement...</div>`;

        try {
            if (tabName === 'dashboard') { setActiveMenus('dashboard'); await renderDashboard(); }
            else if (tabName === 'acheter') { setActiveMenus('dashboard'); await renderTradeForm('achat'); }
            else if (tabName === 'vendre') { setActiveMenus('dashboard'); await renderTradeForm('vente'); }
            else if (tabName === 'convertir') { setActiveMenus('dashboard'); await renderConvert(); }
            else if (tabName === 'deposer') { setActiveMenus('dashboard'); await renderDeposit(presetCrypto); }
            else if (tabName === 'retirer') { setActiveMenus('dashboard'); await renderWithdraw(presetCrypto); }
            else if (tabName === 'portefeuille') { setActiveMenus('portefeuille'); await renderWallet(); }
            else if (tabName === 'transactions') { setActiveMenus('transactions'); await renderTransactions('tous'); }
            else if (tabName === 'profil') { setActiveMenus('profil'); await renderProfil(); }
            else if (tabName === 'parametres') { setActiveMenus('parametres'); await renderParametres(); }
        } catch (err) {
            handleApiError(err, mainContent);
        }
    }

function setActiveMenus(tabName) {
        const map = { 'dashboard': 0, 'portefeuille': 1, 'transactions': 2, 'profil': 3, 'parametres': 4 };
        const index = map[tabName] !== undefined ? map[tabName] : 0;

        const sidebarItems = document.querySelectorAll('.sidebar-menu li:not(.logout)');
        if (sidebarItems[index]) sidebarItems[index].classList.add('active');

        const bottomMap = { 'dashboard': 0, 'portefeuille': 1, 'transactions': 2, 'profil': 3, 'parametres': 4 };
        const bottomItems = document.querySelectorAll('.bottom-nav li');
        if (bottomMap[tabName] !== undefined && bottomItems[bottomMap[tabName]]) {
            bottomItems[bottomMap[tabName]].classList.add('active');
        }
    }

    function txRowHTML(tx) {
        let title = TX_LABELS[tx.type];
        let sub = fmtDate(tx.createdAt);
        let amount = '';

        if (tx.type === 'achat' || tx.type === 'vente') {
            title += ` ${tx.crypto}`;
            sub = `${tx.network || ''}${tx.cryptoNetwork ? ' → ' + tx.cryptoNetwork : ''} · ${sub}`;
            amount = (tx.type === 'achat' ? '+' : '-') + fmtCrypto(tx.cryptoAmount) + ' ' + tx.crypto;
        } else if (tx.type === 'conversion') {
            title = `${tx.fromCurrency} → ${tx.toCurrency}`;
            amount = `${fmtCrypto(tx.fromAmount)} ${tx.fromCurrency} → ${fmtCrypto(tx.toAmount)} ${tx.toCurrency}`;
        } else if (tx.type === 'depot') {
            title += ` ${tx.crypto}`;
            sub = `${tx.network} · ${sub}`;
            amount = tx.cryptoAmount ? '+' + fmtCrypto(tx.cryptoAmount) + ' ' + tx.crypto : '—';
        } else if (tx.type === 'retrait') {
            title += ` ${tx.crypto}`;
            sub = `${tx.network} · ${sub}`;
            amount = '-' + fmtCrypto(tx.cryptoAmount) + ' ' + tx.crypto;
        } else if (tx.type === 'retrait_fcfa') {
            sub = `${tx.network || ''} · ${sub}`;
            const total = (tx.fcfaAmount || 0) + (tx.feeAmount || 0);
            amount = '-' + fmtFCFA(total);
        }

        const actions = tx.status === 'en_attente'
            ? `<div class="tx-actions">
                    ${['depot', 'achat', 'retrait', 'retrait_fcfa'].includes(tx.type) ? `<button onclick="onConfirmTx('${tx.id}')">Confirmer</button>` : ''}
                    <button onclick="onCancelTx('${tx.id}')">Annuler</button>
               </div>`
            : '';

        return `
            <div class="tx-item">
                <div class="tx-left">
                    <div class="tx-icon"><svg class="icon" viewBox="0 0 24 24">${txIconSvg(tx.type)}</svg></div>
                    <div>
                        <div class="tx-title">${title}</div>
                        <div class="tx-sub">${sub}</div>
                    </div>
                </div>
                <div class="tx-right">
                    <span class="badge ${STATUS_BADGE[tx.status]}">${STATUS_LABELS[tx.status]}</span>
                    <div class="tx-amount">${amount}</div>
                    ${actions}
                </div>
            </div>
        `;
    }

    // Valeur en FCFA de "amount" unités de "currency" si on la VEND (source).
    function sellValueInFCFA(amount, currency) { return currency === 'FCFA' ? amount : amount * sellRates[currency]; }
    // Quantité de "currency" obtenue avec "fcfaValue" si on l'ACHÈTE (cible).
    function buyAmountFromFCFA(fcfaValue, currency) { return currency === 'FCFA' ? fcfaValue : fcfaValue / buyRates[currency]; }

    function balanceHintFor(currency) {
        const bal = (window.__balancesCache && window.__balancesCache[currency]) || 0;
        return currency === 'FCFA' ? `Solde disponible : ${fmtFCFA(bal)}` : `Solde disponible : ${fmtCrypto(bal)} ${currency}`;
    }

    function updateFromBalanceHint() {
        const from = document.getElementById('fromCurrency').value;
        const hint = document.getElementById('fromBalanceHint');
        if (hint) hint.textContent = balanceHintFor(from);
    }

    function onConvertCurrencyChange() {
        const from = document.getElementById('fromCurrency');
        const to = document.getElementById('toCurrency');
        if (from.value === to.value) {
            for (let opt of to.options) { if (opt.value !== from.value) { to.value = opt.value; break; } }
        }
        updateConvRateLabel();
        updateFromBalanceHint();
        calcConvert('from');
    }

    function updateConvRateLabel() {
        const from = document.getElementById('fromCurrency').value;
        const to = document.getElementById('toCurrency').value;
        const equiv = buyAmountFromFCFA(sellValueInFCFA(1, from), to);
        document.getElementById('convRateLabel').textContent = `1 ${from} ≈ ${equiv.toLocaleString('fr-FR', { maximumFractionDigits: 6 })} ${to}`;
    }

    function calcConvert(direction) {
        const from = document.getElementById('fromCurrency').value;
        const to = document.getElementById('toCurrency').value;
        const fromEl = document.getElementById('fromAmount');
        const toEl = document.getElementById('toAmount');

        if (direction === 'from') {
            const amount = parseFloat(fromEl.value);
            toEl.value = !isNaN(amount) ? buyAmountFromFCFA(sellValueInFCFA(amount, from), to).toFixed(to === 'FCFA' ? 0 : 6) : '';
        } else {
            const amount = parseFloat(toEl.value);
            // Sens inverse : on part de la quantité cible désirée pour
            // remonter au montant source nécessaire — utilise le taux de
            // vente sur la cible et le taux d'achat sur la source, symétrie
            // volontaire pour un aperçu cohérent (le serveur recalcule).
            fromEl.value = !isNaN(amount) ? buyAmountFromFCFA(sellValueInFCFA(amount, to), from).toFixed(from === 'FCFA' ? 0 : 6) : '';
        }
    }

    function swapConvert() {
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const tmp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = tmp;
        updateConvRateLabel();
        updateFromBalanceHint();
        calcConvert('from');
    }

    async function handleConvertSubmit(event) {
        event.preventDefault();
        const btn = document.getElementById('convertSubmitBtn');
        btn.disabled = true;
        btn.textContent = 'Traitement...';
        try {
            const fromCurrency = document.getElementById('fromCurrency').value;

            const fromAmount = parseFloat(document.getElementById('fromAmount').value);
            const toAmount = parseFloat(document.getElementById('toAmount').value);
            if (!fromAmount || !toAmount) throw new Error('Merci de renseigner un montant valide.');

            await API.transactions.convert({ fromCurrency, fromAmount, toCurrency, toAmount });

            switchTab('dashboard');
        } catch (e) {
            showToast(e.message);
            btn.disabled = false;
            btn.textContent = 'Convertir maintenant';
        }
    }

            { key: 'retrait_fcfa', label: 'Retraits Mobile Money' }
        ];
        const chipsHTML = chips.map(c =>
            `<div class="chip ${c.key === filter ? 'active' : ''}" onclick="renderTransactions('${c.key}')">${c.label}</div>`
        ).join('');

        const listHTML = transactions.length === 0
            ? `<div class="empty-transactions">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19"/></svg>
                    <p>Aucune transaction</p>
                    <span>Les opérations de ce type apparaîtront ici</span>
               </div>`
            : `<div class="tx-list">${transactions.map(txRowHTML).join('')}</div>`;

        document.getElementById('mainContent').innerHTML = backLink() + `
            <div class="topbar"><h1>Transactions</h1></div>
            <div class="chip-row">${chipsHTML}</div>
            <div class="card-section">${listHTML}</div>
        `;
        setActiveMenus('transactions');
    }

    /* =====================================================================
       PROFIL
       ===================================================================== */

async function renderProfil() {
        const res = await API.profile.get();
        const profile = normalizeProfile(res.profile);
        const kycMap = {
            non_verifie: { label: 'Non vérifié', badge: 'badge-failed' },
            en_attente: { label: 'Vérification en cours', badge: 'badge-pending' },
            verifie: { label: 'Vérifié', badge: 'badge-done' }
        };
        const kyc = kycMap[profile.kyc] || kycMap.non_verifie;
        const initial = (profile.firstName || '?').charAt(0).toUpperCase();

        document.getElementById('mainContent').innerHTML = backLink() + `
            <div class="topbar"><h1>Profil</h1></div>

            <div class="profile-header">
                <div class="profile-avatar">${initial}</div>
                <div>
                    <div class="profile-name">${profile.firstName || ''} ${profile.lastName || ''}</div>
                    <div class="profile-email">${profile.email || 'Aucun e-mail renseigné'}</div>
                    <span class="badge ${kyc.badge}" style="margin-top:6px;">Statut KYC : ${kyc.label}</span>
                </div>
            </div>

            <div class="buy-container">
                <div class="buy-box" style="max-width:100%;">
                    <form id="profileForm">
                        <div class="form-row-2">
                            <div class="form-field">
                                <label>Prénom</label>
                                <div class="input-group"><input type="text" id="firstName" value="${profile.firstName || ''}" required></div>
                            </div>
                            <div class="form-field">
                                <label>Nom</label>
                                <div class="input-group"><input type="text" id="lastName" value="${profile.lastName || ''}"></div>
                            </div>
                        </div>

                        <div class="form-field">
                            <label>E-mail</label>
                            <div class="input-group"><input type="email" id="email" value="${profile.email || ''}" placeholder="vous@exemple.com"></div>
                        </div>

                        <div class="form-field">
                            <label>Téléphone</label>
                            <div class="input-group"><input type="tel" id="phone" value="${profile.phone || ''}" placeholder="Ex: +226 00 00 00 00"></div>
                        </div>

                        <div class="form-field">
                            <label>Pays de résidence</label>
                            <div class="input-group">
                                <select id="country" style="width:100%; border-left:none;">${countryOptions()}</select>
                            </div>
                        </div>

                        <button type="submit" class="btn-submit" id="profileSubmitBtn">Enregistrer les modifications</button>
                    </form>

                    ${profile.kyc !== 'verifie' ? `<button class="btn-secondary" onclick="startKyc()">Lancer la vérification d'identité (KYC)</button>` : ''}
                    
                    <!-- Bouton de redirection vers les paramètres -->
                    <button class="btn-secondary" style="margin-top: 10px;" onclick="switchTab('parametres')">⚙️ Gérer les paramètres du compte</button>
                </div>
            </div>
        `;
        document.getElementById('country').value = profile.country || 'Burkina Faso';
        document.getElementById('profileForm').addEventListener('submit', handleProfileSubmit);
    }

    async function handleProfileSubmit(event) {
        event.preventDefault();
        const btn = document.getElementById('profileSubmitBtn');
        btn.disabled = true;
        btn.textContent = 'Enregistrement...';
        try {
            await API.profile.update({
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                country: document.getElementById('country').value
            });
            showToast('Profil mis à jour');
            renderProfil();
        } catch (e) {
            showToast(e.message);
            btn.disabled = false;
            btn.textContent = 'Enregistrer les modifications';
        }
    }

    async function startKyc() {
        try {
            await API.profile.startKyc();
            showToast("Vérification d'identité lancée");
            renderProfil();
        } catch (e) { showToast(e.message); }
    }

    /* =====================================================================
       PARAMÈTRES
       ===================================================================== */

    async function renderParametres() {
        const res = await API.settings.get();
        const settings = res.settings;

        document.getElementById('mainContent').innerHTML = backLink() + `
            <div class="topbar"><h1>Paramètres</h1></div>

            <div class="settings-block">
                <h4>Apparence</h4>
                <div class="desc">Choisissez le thème de l'application.</div>
                <div class="settings-row">
                    <div>
                        <div class="settings-row-label">Thème</div>
                        <div class="settings-row-sub">Clair ou sombre</div>
                    </div>
                    <div class="segmented">
                        <button id="themeLightBtn" onclick="setTheme('light')">Clair</button>
                        <button id="themeDarkBtn" onclick="setTheme('dark')">Sombre</button>
                    </div>
                </div>
                <div class="settings-row">
                    <div>
                        <div class="settings-row-label">Langue</div>
                        <div class="settings-row-sub">Langue de l'interface</div>
                    </div>
                    <div class="input-group" style="width:140px;">
                        <select id="languageSelect" style="width:100%; border-left:none;" onchange="onSettingChange()">
                            <option value="fr">Français</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="settings-block">
                <h4>Notifications</h4>
                <div class="desc">Choisissez comment être prévenu de l'état de vos transactions.</div>
                <div class="settings-row">
                    <div><div class="settings-row-label">E-mail</div></div>
                    <label class="toggle"><input type="checkbox" id="notifEmail" onchange="onSettingChange()"><span class="toggle-slider"></span></label>
                </div>
                <div class="settings-row">
                    <div><div class="settings-row-label">SMS</div></div>
                    <label class="toggle"><input type="checkbox" id="notifSms" onchange="onSettingChange()"><span class="toggle-slider"></span></label>
                </div>
                <div class="settings-row">
                    <div><div class="settings-row-label">Notifications push</div></div>
                    <label class="toggle"><input type="checkbox" id="notifPush" onchange="onSettingChange()"><span class="toggle-slider"></span></label>
                </div>
            </div>

            <div class="settings-block">
                <h4>Sécurité</h4>
                <div class="desc">Protégez l'accès à votre compte.</div>
                <div class="settings-row">
                    <div>
                        <div class="settings-row-label">Authentification à deux facteurs</div>
                        <div class="settings-row-sub">Code de sécurité supplémentaire à la connexion</div>
                    </div>
                    <label class="toggle"><input type="checkbox" id="twoFactor" onchange="onSettingChange()"><span class="toggle-slider"></span></label>
                </div>

                <form id="passwordForm" style="margin-top:16px;">
                    <div class="form-field">
                        <label>Mot de passe actuel</label>
                        <div class="input-group"><input type="password" id="currentPassword" required></div>
                    </div>
                    <div class="form-row-2">
                        <div class="form-field">
                            <label>Nouveau mot de passe</label>
                            <div class="input-group"><input type="password" id="newPassword" required minlength="8"></div>
                        </div>
                        <div class="form-field">
                            <label>Confirmer</label>
                            <div class="input-group"><input type="password" id="confirmPassword" required minlength="8"></div>
                        </div>
                    </div>
                    <button type="submit" class="btn-secondary" id="passwordSubmitBtn">Changer le mot de passe</button>
                </form>
            </div>
        `;

        document.getElementById('languageSelect').value = settings.language;
        document.getElementById('notifEmail').checked = !!settings.notifications.email;
        document.getElementById('notifSms').checked = !!settings.notifications.sms;
        document.getElementById('notifPush').checked = !!settings.notifications.push;
        document.getElementById('twoFactor').checked = !!settings.twoFactor;
        highlightThemeButtons(settings.theme);

        document.getElementById('passwordForm').addEventListener('submit', handlePasswordSubmit);
    }

    function highlightThemeButtons(theme) {
        document.getElementById('themeLightBtn').classList.toggle('active', theme === 'light');
        document.getElementById('themeDarkBtn').classList.toggle('active', theme === 'dark');
    }

    async function setTheme(theme) {
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', theme);
        highlightThemeButtons(theme);
        try {
            await API.settings.update({ theme });
        } catch (e) { showToast(e.message); }
    }

    async function onSettingChange() {
        try {
            await API.settings.update({
                language: document.getElementById('languageSelect').value,
                notifications: {
                    email: document.getElementById('notifEmail').checked,
                    sms: document.getElementById('notifSms').checked,
                    push: document.getElementById('notifPush').checked
                },
                twoFactor: document.getElementById('twoFactor').checked
            });
            showToast('Préférences enregistrées');
        } catch (e) { showToast(e.message); }
    }

    async function handlePasswordSubmit(event) {
        event.preventDefault();
        const btn = document.getElementById('passwordSubmitBtn');
        const current = document.getElementById('currentPassword').value;
        const next = document.getElementById('newPassword').value;
        const confirmVal = document.getElementById('confirmPassword').value;

        if (next !== confirmVal) { showToast('Les mots de passe ne correspondent pas.'); return; }

        btn.disabled = true;
        btn.textContent = 'Modification...';
        try {
            await API.settings.changePassword({ currentPassword: current, newPassword: next });
            showToast('Mot de passe mis à jour');
            document.getElementById('passwordForm').reset();
        } catch (e) {
            showToast(e.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Changer le mot de passe';
        }
    }

    /* =====================================================================
       INITIALISATION
       ===================================================================== */

    (function applyCachedTheme() {
        const cached = localStorage.getItem('theme');
        if (cached === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (cached === 'light') document.documentElement.removeAttribute('data-theme');
    })();

    (async function init() {
        try {
            await renderDashboard();
        } catch (err) {
            handleApiError(err, document.getElementById('mainContent'));
        }
    })();
    </script>
  <script src="../js/pwa.js"></script>
</body>
</html>
