<!-- pages/reset-password.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe - ExCrypt</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html" class="auth-logo">
                    <span class="logo-icon">₿</span>
                    <span class="logo-text">ExCrypt</span>
                </a>
                <h1>Nouveau mot de passe</h1>
                <p>Créez un nouveau mot de passe pour votre compte</p>
            </div>

            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="newPassword">Nouveau mot de passe</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            placeholder="8 caractères minimum"
                            required
                            minlength="8"
                        />
                        <button type="button" class="toggle-password" id="togglePassword">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirmer le mot de passe</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="confirmNewPassword" 
                            name="confirmNewPassword" 
                            placeholder="Confirmer le mot de passe"
                            required
                        />
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
                    <span class="btn-text">Réinitialiser</span>
                    <span class="btn-loader" style="display: none;">
                        <span class="spinner"></span>
                    </span>
                </button>

                <div class="auth-alternative">
                    <p><a href="login.html" class="auth-link">← Retour à la connexion</a></p>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
