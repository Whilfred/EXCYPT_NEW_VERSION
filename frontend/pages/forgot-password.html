<!-- pages/forgot-password.html - Correction des chemins -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16845b">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <title>Mot de passe oublié - ExCrypt</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html" class="auth-logo">
                    <span class="logo-icon">₿</span>
                    <span class="logo-text">ExCrypt</span>
                </a>
                <h1>Mot de passe oublié</h1>
                <p>Nous vous enverrons un lien pour réinitialiser votre mot de passe</p>
            </div>

            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="exemple@email.com"
                        required
                    />
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
                    <span class="btn-text">Envoyer le lien</span>
                    <span class="btn-loader" style="display: none;">
                        <span class="spinner"></span>
                    </span>
                </button>

                <div class="auth-alternative">
                    <p><a href="login.html" class="auth-link">← Retour à la connexion</a></p>
                </div>
            </form>

            <div id="successMessage" class="auth-success" style="display: none;">
                <div class="success-icon">✅</div>
                <h3>Email envoyé !</h3>
                <p>Consultez votre boîte mail pour réinitialiser votre mot de passe.</p>
                <button onclick="location.href='login.html'" class="btn btn-outline btn-block">
                    Retour à la connexion
                </button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
  <script src="../js/pwa.js"></script>
</body>
</html>
