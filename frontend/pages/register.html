<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16845b">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <title>Inscription — ExCrypt</title>
  <style>
    :root { --ink:#17202a; --muted:#68727d; --line:#e5e8eb; --paper:#fff; --green:#16845b; --green-dark:#0f6848; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; line-height:1.5; }
    a { color:inherit; text-decoration:none; }
    button, input { font:inherit; }
    button { cursor:pointer; }
    .navbar { background:#fff; border-bottom:1px solid var(--line); }
    .container { width:min(1100px,calc(100% - 40px)); margin:0 auto; }
    .nav-inner { min-height:70px; display:flex; align-items:center; justify-content:space-between; }
    .logo { display:inline-flex; align-items:center; gap:10px; font-size:1.05rem; font-weight:700; }
    .logo-mark { width:30px; height:30px; border-radius:6px; display:grid; place-items:center; background:var(--ink); color:#fff; font-size:.9rem; }
    .back-link { color:var(--muted); font-size:.9rem; }
    .back-link:hover { color:var(--ink); }
    .auth-main { min-height:calc(100vh - 71px); display:flex; align-items:center; justify-content:center; padding:54px 20px; }
    .auth-card { width:min(100%,520px); }
    .auth-header { text-align:center; margin-bottom:28px; }
    .auth-header h1 { font-size:clamp(2rem,5vw,2.55rem); line-height:1.08; letter-spacing:-.045em; margin-bottom:10px; }
    .auth-header p { color:var(--muted); font-size:.96rem; }
    .auth-form { border:1px solid var(--line); border-radius:10px; padding:28px; background:#fff; box-shadow:0 8px 24px rgba(23,32,42,.04); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-group { margin-bottom:19px; }
    label { display:block; color:var(--ink); font-size:.85rem; font-weight:600; margin-bottom:8px; }
    input { width:100%; height:46px; padding:0 13px; border:1px solid #cfd5db; border-radius:6px; outline:0; color:var(--ink); background:#fff; transition:border-color .2s,box-shadow .2s; }
    input::placeholder { color:#98a1aa; }
    input:hover { border-color:#aeb7bf; }
    input:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(22,132,91,.12); }
    .input-wrapper { position:relative; }
    .input-wrapper input { padding-right:42px; }
    .toggle-password { position:absolute; top:50%; right:9px; transform:translateY(-50%); border:0; background:transparent; color:#89949e; padding:6px; }
    .toggle-password:hover { color:var(--green); }
    .toggle-password:focus-visible, .back-link:focus-visible, .btn-primary:focus-visible { outline:3px solid rgba(22,132,91,.2); outline-offset:2px; }
    .password-requirements { display:flex; flex-wrap:wrap; gap:5px 15px; list-style:none; margin-top:8px; color:var(--muted); font-size:.75rem; }
    .req-item.valid { color:var(--green); }
    .checkbox-label { display:flex; align-items:flex-start; gap:8px; color:var(--muted); font-size:.8rem; font-weight:400; line-height:1.45; cursor:pointer; }
    .checkbox-label input { flex:0 0 auto; width:15px; height:15px; margin-top:2px; padding:0; accent-color:var(--green); }
    .checkbox-label a, .auth-link { color:var(--green); font-weight:600; }
    .checkbox-label a:hover, .auth-link:hover { color:var(--green-dark); text-decoration:underline; }
    .btn-primary { width:100%; min-height:46px; border:1px solid var(--green); border-radius:6px; background:var(--green); color:#fff; font-size:.92rem; font-weight:600; transition:background .2s,border-color .2s; }
    .btn-primary:hover { background:var(--green-dark); border-color:var(--green-dark); }
    .auth-divider { display:flex; align-items:center; gap:12px; margin:24px 0 20px; color:#9aa3ab; font-size:.8rem; }
    .auth-divider::before, .auth-divider::after { content:""; height:1px; flex:1; background:var(--line); }
    .auth-alternative { text-align:center; color:var(--muted); font-size:.88rem; }
    .auth-alternative p { margin:0; }
    .spinner { width:16px; height:16px; display:inline-block; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:620px) {
      .container { width:min(100% - 28px,1100px); }
      .auth-main { min-height:calc(100vh - 71px); padding:38px 14px; align-items:flex-start; }
      .auth-card { margin-top:20px; }
      .auth-form { padding:22px 18px; }
      .form-row { grid-template-columns:1fr; gap:0; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="../index.html" aria-label="Retour à l'accueil ExCrypt"><span class="logo-mark" aria-hidden="true">E</span><span>ExCrypt</span></a>
      <a class="back-link" href="../index.html">Retour à l'accueil</a>
    </div>
  </nav>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="register-title">
      <header class="auth-header">
        <h1 id="register-title">Créer un compte</h1>
        <p>Commencez à utiliser ExCrypt simplement.</p>
      </header>

      <form id="registerForm" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" name="firstName" placeholder="Prénom" required autocomplete="given-name">
          </div>
          <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" name="lastName" placeholder="Nom" required autocomplete="family-name">
          </div>
        </div>

        <div class="form-group">
          <label for="email">Adresse email</label>
          <input type="email" id="email" name="email" placeholder="vous@exemple.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="phoneNumber">Numéro de téléphone</label>
          <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+237 6XX XX XX XX" required autocomplete="tel">
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="8 caractères minimum" required minlength="8" autocomplete="new-password">
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Afficher le mot de passe" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button>
          </div>
          <ul class="password-requirements" id="passwordRequirements" aria-label="Exigences du mot de passe">
            <li class="req-item" data-req="length">○ 8 caractères minimum</li>
            <li class="req-item" data-req="uppercase">○ Une majuscule</li>
            <li class="req-item" data-req="number">○ Un chiffre</li>
          </ul>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le mot de passe</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirmer le mot de passe" required autocomplete="new-password">
            <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Afficher la confirmation du mot de passe" aria-pressed="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button>
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-label"><input type="checkbox" name="terms" id="terms" required><span>J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a>.</span></label>
        </div>

        <button type="submit" class="btn-primary" id="registerBtn"><span class="btn-text">Créer mon compte</span><span class="btn-loader" style="display:none"><span class="spinner" aria-hidden="true"></span></span></button>
        <div class="auth-divider" aria-hidden="true"><span>ou</span></div>
        <div class="auth-alternative"><p>Déjà un compte ? <a href="login.html" class="auth-link">Se connecter</a></p></div>
      </form>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function setupPasswordToggle(buttonId, inputId) {
      const button = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      button?.addEventListener('click', () => {
        const isVisible = input.type === 'text';
        input.type = isVisible ? 'password' : 'text';
        button.setAttribute('aria-pressed', String(!isVisible));
        button.setAttribute('aria-label', isVisible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
      });
    }
    setupPasswordToggle('togglePassword', 'password');
    setupPasswordToggle('toggleConfirmPassword', 'confirmPassword');

    const password = document.getElementById('password');
    password?.addEventListener('input', () => {
      const value = password.value;
      const checks = { length: value.length >= 8, uppercase: /[A-Z]/.test(value), number: /\d/.test(value) };
      document.querySelectorAll('.req-item').forEach(item => {
        const valid = checks[item.dataset.req];
        item.classList.toggle('valid', valid);
        item.textContent = (valid ? '✓ ' : '○ ') + item.textContent.slice(2);
      });
    });
  </script>
  <script src="../js/pwa.js"></script>
</body>
</html>
