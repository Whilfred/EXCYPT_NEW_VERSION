<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16845b">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <title>Vendre - ExCrypt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #fafafa; --card: #ffffff; --border: #eaecef;
            --text: #1e2329; --muted: #707a8a; --accent: #0b0e11;
            --green: #03a66d; --red: #cf304a; --input-bg: #fff;
        }

        [data-theme="dark"] {
            --bg: #12161c; --card: #1e2329; --border: #2b313a;
            --text: #eaecef; --muted: #848e9c; --accent: #fcd535;
            --green: #0ecb81; --red: #f6465d; --input-bg: #12161c;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; transition: background 0.2s, color 0.2s; }
        svg { display: block; }
        .icon { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .app { display: flex; min-height: 100vh; }
        
        /* SIDEBAR (PC) */
        .sidebar { width: 240px; background: var(--card); border-right: 1px solid var(--border); padding: 24px 16px; position: fixed; height: 100vh; left: 0; top: 0; display: flex; flex-direction: column; justify-content: space-between; z-index: 100; }
        .sidebar-top { display: flex; flex-direction: column; }
        .sidebar-logo { font-size: 19px; font-weight: 700; margin-bottom: 32px; padding: 0 12px; display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li, .sidebar-menu a { padding: 11px 12px; border-radius: 8px; margin-bottom: 2px; cursor: pointer; transition: background .15s; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px; font-weight: 500; text-decoration: none; }
        .sidebar-menu li:hover, .sidebar-menu a:hover { background: var(--bg); color: var(--text); }
        .sidebar-menu li.active, .sidebar-menu a.active { background: var(--bg); color: var(--text); font-weight: 600; }
        .sidebar-menu .logout { color: var(--red); margin-top: 10px; border-top: 1px solid var(--border); padding-top: 20px; }
        .sidebar-menu .logout:hover { background: rgba(207, 48, 74, 0.1); }

        /* CONTENU PRINCIPAL */
        .main { margin-left: 240px; padding: 28px 32px 100px; flex: 1; max-width: 1200px; }
        
        /* TOPBAR INTERNE */
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .topbar h1 { font-size: 22px; font-weight: 700; }
        .topbar-actions { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: var(--card); border: 1px solid var(--border); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 600; }

        /* SECTION FORMULAIRE VENTE */
        .buy-container { display: flex; justify-content: center; width: 100%; margin-top: 10px; }
        .buy-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: 100%; max-width: 520px; }
        .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-header-flex h3 { font-size: 16px; font-weight: 600; }
        .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .form-field label { font-size: 13px; font-weight: 500; color: var(--muted); }
        .input-group { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); overflow: hidden; }
        .input-group input { flex: 1; padding: 12px 14px; border: none; background: transparent; color: var(--text); font-size: 15px; outline: none; }
        .input-group select { padding: 12px 14px; border: none; background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; border-left: 1px solid var(--border); outline: none; cursor: pointer; }
        .rate-info { font-size: 12px; color: var(--muted); margin-bottom: 16px; display: flex; justify-content: space-between; background: var(--bg); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); }
        .rate-info span { font-weight: 600; color: var(--text); }
        .btn-submit { width: 100%; background: var(--accent); color: var(--bg); border: none; padding: 14px; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; }

        /* NAVIGATION MOBILE (BAS) */
        .bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); padding: 6px 2px; z-index: 100; }
        .bottom-nav ul { list-style: none; display: flex; justify-content: space-around; align-items: center; }
        .bottom-nav li, .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 10px; cursor: pointer; padding: 4px 6px; flex: 1; text-decoration: none; }
        .bottom-nav li .icon, .bottom-nav a .icon { width: 18px; height: 18px; }
        .bottom-nav li.active, .bottom-nav a.active { color: var(--text); font-weight: 600; }

        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main { margin-left: 0; padding: 20px 16px 90px; }
            .bottom-nav { display: block; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- SIDEBAR FIXE (PC) -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <a href="index.html" class="sidebar-logo">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3 5-3 5-3-5 3-5z"/><path d="M12 12l3 5-3 5-3-5 3-5z"/></svg>
                    ExCrypt
                </a>
                <ul class="sidebar-menu">
                    <li>
                        <a href="index.html">
                            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
                            Tableau de bord
                        </a>
                    </li>
                    <li>
                        <a href="portefeuille.html">
                            <svg class="icon" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19"/><circle cx="17" cy="14" r="1"/></svg>
                            Portefeuille
                        </a>
                    </li>
                    <li>
                        <a href="transactions.html">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4"/><path d="M21 7H8a4 4 0 0 0-4 4v1"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h13a4 4 0 0 0 4-4v-1"/></svg>
                            Transactions
                        </a>
                    </li>
                    <li>
                        <a href="profil.html">
                            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 5-6 7.5-6s6 2 7.5 6"/></svg>
                            Profil
                        </a>
                    </li>
                    <li>
                        <a href="parametres.html">
                            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                            Paramètres
                        </a>
                    </li>
                </ul>
            </div>
            <ul class="sidebar-menu">
                <li class="logout" onclick="alert('Déconnexion...')">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Déconnexion
                </li>
            </ul>
        </aside>

        <!-- CONTENU PRINCIPAL -->
        <main class="main">
            <div class="topbar">
                <h1>Vendre de la crypto</h1>
                <div class="topbar-actions">
                    <div class="icon-btn">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    </div>
                    <div class="user-avatar">F</div>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <a href="index.html" style="color: var(--muted); text-decoration: none; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;">← Retour au tableau de bord</a>
            </div>

            <div class="buy-container">
                <div class="buy-box">
                    <div class="section-header-flex" style="margin-bottom: 20px;">
                        <h3>Vente instantanée</h3>
                    </div>
                    <div class="rate-info">
                        <span>Taux de rachat :</span> 1 Unité = 580 FCFA
                    </div>
                    <form onsubmit="handleSellAction(event)">
                        <div class="form-field">
                            <label>1. Vous vendez (Crypto)</label>
                            <div class="input-group">
                                <input type="number" id="cryptoSellInput" placeholder="0.0000" oninput="calculateSellCFA()" required>
                                <select id="cryptoSellSelect">
                                    <option value="USDT">USDT</option>
                                    <option value="BTC">BTC</option>
                                    <option value="ETH">ETH</option>
                                    <option value="BNB">BNB</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-field">
                            <label>2. Vous recevez (FCFA)</label>
                            <div class="input-group">
                                <input type="number" id="cfaSellOutput" placeholder="Ex: 58000" oninput="calculateSellCrypto()" required>
                                <select style="background:var(--card);"><option>FCFA</option></select>
                            </div>
                        </div>

                        <div class="form-field">
                            <label>3. Pays de résidence (Afrique de l'Ouest)</label>
                            <div class="input-group">
                                <select id="countrySelectSell" onchange="updateSellNetworks()" style="width:100%; border-left:none;">
                                    <option value="Burkina Faso">Burkina Faso</option>
                                    <option value="Côte d'Ivoire">Côte d'Ivoire</option>
                                    <option value="Sénégal">Sénégal</option>
                                    <option value="Mali">Mali</option>
                                    <option value="Bénin">Bénin</option>
                                    <option value="Togo">Togo</option>
                                    <option value="Niger">Niger</option>
                                    <option value="Guinée">Guinée</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-field">
                            <label>4. Réseau de réception (Mobile Money)</label>
                            <div class="input-group">
                                <select id="networkSelectSell" style="width:100%; border-left:none;"></select>
                            </div>
                        </div>

                        <div class="form-field">
                            <label>5. Numéro de téléphone (Mobile Money)</label>
                            <div class="input-group">
                                <input type="tel" id="phoneSellNumber" placeholder="Ex: +226 00 00 00 00" required style="width:100%;">
                            </div>
                        </div>

                        <button type="submit" class="btn-submit">Vendre maintenant</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- NAVIGATION MOBILE (BAS) -->
    <nav class="bottom-nav">
        <ul>
            <li>
                <a href="index.html">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
                    Accueil
                </a>
            </li>
            <li>
                <a href="portefeuille.html">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19"/><circle cx="17" cy="14" r="1"/></svg>
                    Portefeuille
                </a>
            </li>
            <li>
                <a href="transactions.html">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4"/><path d="M21 7H8a4 4 0 0 0-4 4v1"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h13a4 4 0 0 0 4-4v-1"/></svg>
                    Activité
                </a>
            </li>
            <li>
                <a href="profil.html">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.5-4 5-6 7.5-6s6 2 7.5 6"/></svg>
                    Profil
                </a>
            </li>
            <li>
                <a href="parametres.html">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Options
                </a>
            </li>
        </ul>
    </nav>

    <script>
        // Gestion du thème sombre/clair
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        const paymentNetworks = {
            "Burkina Faso": ["Orange Money BF", "Moov Africa BF", "Coris Money"],
            "Côte d'Ivoire": ["MTN Money CI", "Orange Money CI", "Moov Money CI", "Wave CI"],
            "Sénégal": ["Orange Money SN", "Free Money SN", "Wizall Money", "E-Money"],
            "Mali": ["Orange Money ML", "Moov Money ML", "Sama Money"],
            "Bénin": ["MTN Momo BJ", "Moov Money BJ"],
            "Togo": ["Moov T-Mobile", "TMoney Togo"],
            "Niger": ["Airtel Money NE", "Moov Money NE", "Orange Money NE"],
            "Guinée": ["Orange Money GN", "MTN Money GN"]
        };

        function updateSellNetworks() {
            const countrySelect = document.getElementById('countrySelectSell');
            const networkSelect = document.getElementById('networkSelectSell');
            if(!countrySelect || !networkSelect) return;
            const selectedCountry = countrySelect.value;
            
            networkSelect.innerHTML = '';
            if (paymentNetworks[selectedCountry]) {
                paymentNetworks[selectedCountry].forEach(net => {
                    const opt = document.createElement('option');
                    opt.value = net;
                    opt.textContent = net;
                    networkSelect.appendChild(opt);
                });
            }
        }

        function calculateSellCFA() {
            const cryptoInput = document.getElementById('cryptoSellInput').value;
            const cfaOutput = document.getElementById('cfaSellOutput');
            const rate = 580;
            if (cryptoInput && !isNaN(cryptoInput)) {
                cfaOutput.value = Math.round(cryptoInput * rate);
            } else {
                cfaOutput.value = '';
            }
        }

        function calculateSellCrypto() {
            const cfaInput = document.getElementById('cfaSellOutput').value;
            const cryptoInput = document.getElementById('cryptoSellInput');
            const rate = 580;
            if (cfaInput && !isNaN(cfaInput)) {
                cryptoInput.value = (cfaInput / rate).toFixed(4);
            } else {
                cryptoInput.value = '';
            }
        }

        function handleSellAction(event) {
            event.preventDefault();
            const phone = document.getElementById('phoneSellNumber').value;
            alert(`Vente enregistrée avec succès ! Les fonds seront traités via le numéro ${phone}`);
            window.location.href = 'index.html';
        }

        // Initialisation des réseaux au chargement de la page
        window.onload = function() {
            updateSellNetworks();
        };
    </script>
  <script src="../js/pwa.js"></script>
</body>
</html>
